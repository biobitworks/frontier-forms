name: independent-evidence-check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify_predecessor.py --bundle evidence/freeze/predecessor
      - run: python3 scripts/verify_review_export.py
      - run: python3 scripts/validate_pair_export.py
      - run: python3 -m unittest discover -s tests -v
      - name: Check prohibited raw payload types
        run: python3 scripts/check_public_payloads.py
      - name: Independent Claude synthetic red-team regression
        run: |
          python3 -m pip install pytest==8.4.2
          python3 -m pytest -q lanes/frontier-forms/dataset-freeze-redteam/tests
