name: independent-evidence-check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify_predecessor.py --bundle evidence/freeze/predecessor
      - run: python3 scripts/verify_review_export.py
      - run: python3 scripts/validate_pair_export.py
      - name: Install pinned independent statistical engine
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: numpy==1.26.4 scipy==1.15.3
      - run: python3 -m unittest discover -s tests -v
      - name: Independently verify judge demo synthetic manifest
        run: python3 scripts/verify_judge_demo_manifest.py
      - name: Recompute judge FCO/YOLO negative and admission evidence
        run: python3 scripts/verify_judge_outcome_successor.py
      - name: Verify discovery admission and standard-vs-integrated novelty ledger
        run: python3 scripts/build_discovery_admission_v2.py
      - name: Verify final public data and PR branch completeness snapshot
        run: python3 scripts/verify_final_public_data_coverage.py
      - name: Verify final judge contributor Gantt and actual training-epoch evidence
        run: python3 scripts/build_judge_final_timeline.py
      - name: Recompute independent paired OCR correction and patient bootstrap
        run: python3 scripts/verify_ocr_correction_successor.py
      - name: Frontier Forms FCAR boundary and admission gate
        run: python3 scripts/check_fcar_admission.py
      - name: Check prohibited raw payload types
        run: python3 scripts/check_public_payloads.py
      - name: Synthetic-only JSON publication gate (immutable legacy blob exemption)
        run: python3 scripts/check_synthetic_json_policy.py
      - name: Gitleaks (full history, pinned binary)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts="--all" --config .gitleaks.toml --redact --exit-code 1
