# Gitleaks config for frontier-forms. Default rules, plus an allowlist for the
# three non-secret identifier shapes that the generic-api-key rule flags in our
# synthetic evidence files (full-history scan 2026-11-02: 7,920 findings, all of these):
#   row_key_sha256 / case_digest_sha256 = 64-hex SHA-256 case digests
#   case_key = Synthea patient UUIDs plus form ids
#   template_key = form template names such as medication_allergy_intake_v1
title = "frontier-forms"

[extend]
useDefault = true

[allowlist]
description = "Non-secret identifiers in synthetic evidence"
regexTarget = "match"
# Keys are matched by suffix, and values may be cut short, because the dir
# scanner splits long JSONL lines into chunks. Values must stay pure hex/uuid
# or a lowercase *_vN template name, so a real token still fails.
regexes = [
  '''(sha256|key)"?\s*[:=]\s*"?[0-9a-f]{8,64}"?$''',
  '''_key"?\s*[:=]\s*"?[0-9a-f]{8}-[0-9a-f-]{1,27}''',
  '''key"?\s*[:=]\s*"?[a-z0-9_]+_v[0-9]+"?$''',
]
